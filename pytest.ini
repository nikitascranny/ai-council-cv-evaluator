[pytest]
# Only our own suite is collected by default; integration/ is local-only
# (teammates' code, vendored from GitLab). To run both together:
#     python -m pytest tests integration/Tests
# Their conftest.py registers a fake "parsed_cv" in sys.modules at collection
# time, so anything of ours importing the real parser under that name must
# isolate itself - see tests/unit-tests/test_parsed_cv_shim.py.
testpaths = tests

markers =
    ollama: needs a running Ollama with the default models pulled (deselect with '-m "not ollama"')
    slow: parses a real Batch1 PDF; needs no model and runs by default
    cloud: calls the real Ollama Cloud, spending usage; needs OLLAMA_API_KEY (run with -m cloud)
addopts = -m "not ollama and not cloud"
